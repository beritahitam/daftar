
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GACORWAY</title>
<link rel="icon" type="image/png" href="https://cdn.mixlink.top/global/seamless/1472/IDR/favicon/1920332977.png">
<style>
:root{
  --gold:#ffc107;
  --gold2:#ff9800;
  --green:#145c43;
  --dark:#07120e;
  --text:#f5f0dc;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:radial-gradient(circle at 50% 0%,var(--green) 0%,var(--dark) 60%);
  color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:16px 0 90px; /* ruang untuk sticky bar */
}
.page{
  width:100%;
  max-width:420px;
  padding:0 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.logo{
  width:170px;
  height:50px;
  object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(255,193,7,.7));
}
.title{
  font-size:28px;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  text-align:center;
  color:#fff;
  text-shadow:0 0 18px rgba(255,193,7,.6);
}
.title span{color:var(--gold)}
.sub{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  text-align:center;
  color:rgba(255,193,7,.85);
}
.banner{
  display:block;
  width:100%;
  border-radius:14px;
  border:2px solid var(--gold);
  box-shadow:0 0 22px rgba(255,193,7,.35);
  background:linear-gradient(135deg,#0b2a1f,var(--green));
}
.btn{
  display:block;
  width:100%;
  text-align:center;
  text-decoration:none;
  font-size:19px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:16px;
  border-radius:10px;
  transition:transform .15s;
}
.btn:active{transform:scale(.97)}
.daftar{
  background:linear-gradient(135deg,var(--gold2),var(--gold),var(--gold2));
  color:#07120e;
  box-shadow:0 0 0 1px rgba(255,193,7,.7),0 6px 24px rgba(255,152,0,.55);
}
.login{
  color:var(--gold);
  border:2px solid var(--gold);
  background:rgba(255,193,7,.06);
  box-shadow:inset 0 0 18px rgba(255,193,7,.12);
}
.info{
  font-size:11px;
  text-align:center;
  color:rgba(255,193,7,.7);
  background:rgba(0,0,0,.35);
  border-radius:30px;
  padding:8px 12px;
  line-height:1.5;
}
footer{
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:rgba(255,193,7,.45);
  text-align:center;
  margin-top:6px;
}

/* ===== STICKY BOTTOM BAR ===== */
.sticky-bar{
  position:fixed;
  left:0;right:0;bottom:0;
  display:flex;
  gap:10px;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(7,18,14,.92);
  backdrop-filter:blur(6px);
  border-top:1px solid rgba(255,193,7,.25);
  z-index:99;
}
.sticky-bar .btn{
  font-size:15px;
  padding:13px 8px;
  letter-spacing:.1em;
}
</style>
</head>
<body>
<div class="page">

  <img class="logo" src="https://cdn.mixlink.top/global/seamless/1472/IDR/logo/1839345917.png" alt="GACORWAY">

  <div class="title">GACOR<span>WAY</span></div>
  <div class="sub">⭐ Link Resmi Banjir Scatter ⭐</div>

  <!-- TOMBOL DI ATAS BANNER -->
  <a class="btn daftar" href="https://vip01.gacorway27.com/register?ads=6ac4b4b870ed6" target="_blank" rel="noopener noreferrer">Daftar</a>
  <a class="btn login" href="https://vip01.gacorway-01.com/register?ads=6ac4b4b870ed6" target="_blank" rel="noopener noreferrer">Login</a>

  <a href="https://vip01.gacorway27.com/register?ads=6ac4b4b870ed6" target="_blank" rel="noopener noreferrer">
    <img class="banner" src="https://gacorwayaja.org/img/sctterbanjir.png" alt="GACORWAY Banjir Scatter">
  </a>

  <div class="info">✅ Link Resmi Terbaik • Proses Qris / Layanan Tercepat • RTP Tertinggi</div>

  <footer>© 2026 GACORWAY • Link Resmi Terpercaya</footer>

</div>

<!-- TOMBOL SELALU NEMPEL DI BAWAH LAYAR -->
<div class="sticky-bar">
  <a class="btn daftar" href="https://vip01.gacorway27.com/register?ads=6ac4b4b870ed6" target="_blank" rel="noopener noreferrer">Daftar</a>
  <a class="btn login" href="https://vip01.gacorway-01.com/register?ads=6ac4b4b870ed6" target="_blank" rel="noopener noreferrer">Login</a>
</div>

</body>
</html>
